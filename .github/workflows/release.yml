name: Build NopCommerce SimplePay Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Clone nopCommerce master
        run: |
          git clone https://github.com/nopSolutions/nopCommerce.git
          cd nopCommerce
          git checkout master
          git fetch --tags
          # Checkout the latest stable tag (e.g., release-4.90.6)
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Using nopCommerce tag: $LATEST_TAG"
          git checkout "$LATEST_TAG"

      - name: Copy plugin into nopCommerce
        run: |
          # Support different repository layouts: try common locations where the plugin source may live
          if [ -d "src/Plugins/Nop.Plugin.Payments.SimplePay" ]; then
            SRC_DIR="src/Plugins/Nop.Plugin.Payments.SimplePay"
          elif [ -d "src/Nop.Plugin.Payments.SimplePay" ]; then
            SRC_DIR="src/Nop.Plugin.Payments.SimplePay"
          elif [ -d "Nop.Plugin.Payments.SimplePay" ]; then
            SRC_DIR="Nop.Plugin.Payments.SimplePay"
          else
            echo "Plugin source directory not found"
            ls -la
            exit 1
          fi

          echo "Copying plugin from $SRC_DIR to nopCommerce/src/Plugins/"
          cp -r "$SRC_DIR" nopCommerce/src/Plugins/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # nopCommerce in this workspace targets .NET 9
          dotnet-version: '9.0.x'

      - name: Restore & Build
        run: |
          cd nopCommerce/src/Plugins/Nop.Plugin.Payments.SimplePay
          dotnet restore
          dotnet build -c Release

      - name: Package plugin
        run: |
          # Create package layout and copy plugin files from the nopCommerce clone
          mkdir -p package

          if [ -d "nopCommerce/src/Plugins/Nop.Plugin.Payments.SimplePay" ]; then
            mkdir -p package/Plugins/Nop.Plugin.Payments.SimplePay
            cp -r nopCommerce/src/Plugins/Nop.Plugin.Payments.SimplePay/* package/Plugins/Nop.Plugin.Payments.SimplePay/
          fi

          if [ -d "nopCommerce/src/Presentation/Nop.Web/Plugins/Payments.SimplePay" ]; then
            mkdir -p package/Presentation/Nop.Web/Plugins/Payments.SimplePay
            cp -r nopCommerce/src/Presentation/Nop.Web/Plugins/Payments.SimplePay/* package/Presentation/Nop.Web/Plugins/Payments.SimplePay/
          fi

          cd package
          zip -r ../Payments.SimplePay.zip .

      - name: Validate plugin ZIP structure
        run: |
          chmod +x scripts/validate-zip.sh
          ./scripts/validate-zip.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Payments.SimplePay.zip
