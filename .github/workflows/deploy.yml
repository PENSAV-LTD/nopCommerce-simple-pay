name: Build NopCommerce Plugin

on:
  push:
    branches: [ "main", "develop" ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::816262171726:role/github-pensav-access
          aws-region: eu-central-1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore src/MyPlugin/MyPlugin.csproj

      - name: Build plugin
        run: dotnet build src/MyPlugin/MyPlugin.csproj -c Release

      - name: Run tests
        run: dotnet test tests/MyPlugin.Tests/MyPlugin.Tests.csproj

      - name: Package plugin
        run: |
          mkdir output
          cp -r src/MyPlugin/bin/Release/net8.0 output/
          zip -r MyPlugin.zip output/

      - name: Upload to S3
        run: aws s3 cp MyPlugin.zip s3://my-nopcommerce-artifacts/plugins/
