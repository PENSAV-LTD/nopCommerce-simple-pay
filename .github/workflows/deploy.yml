name: Build NopCommerce Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore src/MyPlugin/MyPlugin.csproj

      - name: Build plugin
        run: dotnet build src/MyPlugin/MyPlugin.csproj -c Release

      - name: Package plugin
        run: |
          mkdir -p package/Presentation/Nop.Web/Plugins/MyPlugin
          cp -r src/MyPlugin/bin/Release/net8.0/* package/Presentation/Nop.Web/Plugins/MyPlugin/
          cd package
          zip -r ../MyPlugin.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: MyPlugin.zip
